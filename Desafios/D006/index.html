<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio de TAGS</title>
</head>
<body>
    <h1>
        Tags HTML
    </h1>
    <p>
        Em HTML, podemos inserir os elementos da lista a seguir. Passe o Mouse sobre os termos para descobrir qual tag deverá utilizar em cada caso.
    </p>
    <ul type="square">
          <li><abbr title="use &lt;p&gt; para escrever parágrafos!">Parágrafos</abbr></li>
          <li><abbr title="use &lt;code&gt; para criar Códigos-Fonte. Se for fazer várias linhas, adicionar a tag &lt;pre&gt; antes da tag code facilita!">Códigos-Fonte</abbr></li>
          <li><abbr title="Para adicionar imagens, use a tag &lt;img&gt;!">Imagens</abbr></li>
          <li><abbr title="Para criar títulos use a tag &lt;h1&gt; até &lt;h6&gt;">Títulos</abbr></li>
          <li><abbr title="use a tag &lt;abbr&gt; para descrever abreaviações!">Abreviações</abbr></li>
          <li><abbr title="use a tag &lt;ol type=&quot;1&quot;&gt; para fazer listas numeradas!">Listas Numeradas</abbr> </li>
          <li><abbr title="use a tag &lt;ul&gt; mudando o type entre: square, circle e disk para mudar o formato do demarcador!">Lista com Demarcadores</abbr></li>
    </ul>
</body>
</html>
