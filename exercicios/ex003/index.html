<!DOCTYPE html>

    <title>Desafio das Imagens</title>
</head>
<body>
    <h1>Modos de colocar imagens</h1>
    <p>Podemos colocar imagens que estão na mesma pasta</p>
    <img src="casa-200.jpeg" alt="Casa">
    <P>Também podemos colocar imagens que estão em subpastas, apenas colocando o caminho certo.
    </P>
    <img src="imagens/pousada-200.jpeg" alt="Pousada">
    <p>Também podemos colocar imagens diretas de URL, mas caso o site que hospeda a imagem caia, a imagem no meu site também cairá.</p>
    <img src="https://static.vecteezy.com/ti/vetor-gratis/p1/74669965-desenho-animado-casa-inundado-agua-reflexao-nublado-ceu-real-estado-propriedade-vetor.jpg" alt="Casa no meio d'agua">
</body>
