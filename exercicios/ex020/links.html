<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Links</title>
    <style>
        body {
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }
        a {
            color:blue;
            text-decoration: none;
        }
        a:hover {
            background-color: black;
            color:white
        }
        a:visited {
            color:brown
        }
        .especial::after {
            content: '↤';
            color:white
        }
        .especial::before{
            content: '↣';
            color:white
        }
        .especial {
            background-color:black;
            color:white
        }
    </style>
</head>
<body>

    </ul>
    
</body>
</html>
