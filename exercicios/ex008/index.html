<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formatação de Textos</title>
</head>
<body>
    <h1>Negrito</h1>
    <p>
       Dá pra colocar em Negrito usando &lt;b&gt; de forma não <b>semântica</b> <br>
        E também é possivel usar a tag &lt;strong&gt;, que é a forma <strong>semântica</strong>.
    </p>
<p>
<h1>Itálico / Ênfase</h1>
        Do mesmo jeito com o Itálico. <br>
        Dá pra usar a tag &lt;i&gt;, de forma não <i>semântica</i>. <br>
        Mas também dá pra usar a tag &lt;em&gt; de forma <em>semântica</em>
</p>

    
</body>
</html>
